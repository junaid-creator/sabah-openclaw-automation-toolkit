name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install isolated test dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Offline tests and supplemental gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python tests/release_gate.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Native product bridge and support guard tests (no Gateway activation)
        run: |
          node --check plugins/product-owner-bridge/index.mjs
          node --check plugins/social-owner-bridge/index.mjs
          node --test tests/test_product_native_bridge.mjs tests/test_support_guards.mjs
